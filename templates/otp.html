<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification | Secure Exam System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
<div class="auth-wrap">
    <a class="back-home" href="{{ url_for('login') }}">← Back to login</a>
    <div class="auth-card">
        <div class="brand centered"><span>Secure Exam System</span></div>
        <div class="otp-icon">•••</div>
        <h1>Verify OTP</h1>
        <p class="auth-subtitle">Enter the 6-digit OTP sent to your registered email.</p>
        {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
        <form method="POST">
            <label>One-Time Password</label>
            <input class="otp-input" type="text" name="otp" maxlength="6" inputmode="numeric" placeholder="000000" required>
            <button class="primary-btn full" type="submit">Verify & Sign In →</button>
        </form>
        <div class="auth-note">OTP is valid for 5 minutes.</div>
    </div>
</div>
</body>
</html>
